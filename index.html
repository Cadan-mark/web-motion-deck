<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Motion Deck</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-theme="dark" data-motion="on">
    <header class="topbar">
      <div>
        <p class="eyebrow">Web Motion Deck</p>
        <h1>原生 Web 视觉交互展示作品</h1>
      </div>
      <div class="toolbar">
        <button type="button" data-action="theme">切换主题</button>
        <button type="button" data-action="motion">关闭动效</button>
        <button type="button" data-action="fullscreen">全屏展示</button>
      </div>
    </header>

    <main class="deck" aria-live="polite">
      <section class="slide is-active" data-slide>
        <span class="slide-index">01</span>
        <h2>HTML Slides</h2>
        <p>使用原生语义化结构组织展示内容，适合课程设计答辩与作品说明场景。</p>
      </section>

      <section class="slide" data-slide>
        <span class="slide-index">02</span>
        <h2>Motion &amp; Micro Interactions</h2>
        <p>通过过渡、位移、透明度与悬停反馈呈现轻量级页面转场和微交互效果。</p>
      </section>

      <section class="slide" data-slide>
        <span class="slide-index">03</span>
        <h2>Responsive Experience</h2>
        <p>支持明暗主题、动效开关、全屏模式与移动端滑动切换，便于多设备展示。</p>
      </section>
    </main>

    <nav class="controls" aria-label="页面控制">
      <button type="button" data-action="prev">上一页</button>
      <span id="statusText" class="status">1 / 3</span>
      <button type="button" data-action="next">下一页</button>
    </nav>

    <script src="script.js"></script>
  </body>
</html>
